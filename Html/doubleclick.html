<!DOCTYPE html>
</head><body>
    <h1>6.doubleclick event </h1>
    <p> double click the text below to change it</p>
    <p id="target" class="box">Double-click the box</p>
     <script>
        const target=document.querySelector("#target");
        target.addEventListerner("dblclick",()=>{
            target.textContent="you double clcked the box!";
            target.style.backgroundColor="#bbf7d0";
        });
     </script>
</body>
