     <body>
    <h1>11. contextmenu-rightclick</h1>
    <p>right-clcik the box.preventdefalut() stops the browser's normal context menu for this</p>
    <div id="target" class="box">Right clcik me.<br>
    </div>

        const target=document.querySelector("#target");
